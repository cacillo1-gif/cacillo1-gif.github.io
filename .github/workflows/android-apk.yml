# Compila l'app Android "Carte Fedeltà" (cartella android/, che usa i file di carte/).
# - Su ogni ramo: l'APK si scarica dagli "Artifacts" della compilazione.
# - Sul ramo main: viene anche pubblicato nella pagina Releases del repository,
#   così si scarica direttamente dal telefono.
name: APK Carte Fedeltà

on:
  push:
    paths:
      - 'carte/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Prepara file
        run: cp android/app/build/outputs/apk/release/app-release.apk CarteFedelta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarteFedelta-apk
          path: CarteFedelta.apk

      - name: Pubblica su Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: carte-v${{ github.run_number }}
          name: Carte Fedeltà (build ${{ github.run_number }})
          body: |
            Scarica **CarteFedelta.apk** qui sotto dal telefono e aprilo per installarlo.
            Se è già installata, la nuova versione si installa sopra senza perdere le carte.
          files: CarteFedelta.apk
          make_latest: true
